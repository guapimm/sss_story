arc_example = "聚会上主角被一圈人围着羞辱，认定他/她一辈子翻不了身。主角不辩，只淡淡约了个时间——到那天，所有嘲讽过他/她的人都要重新认识这个人。"
universal = true
channels = ["male", "female"]
