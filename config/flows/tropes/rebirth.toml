name = "重生流"
hook = "主角带着前世记忆/遗憾重活一世，以信息差与成熟心智改写命运。"
structure = "前期凭先知抢占先机 → 中期蝴蝶效应令记忆逐渐失效、须靠真本事 → 终局超越前世遗憾、了结宿债。"
protagonist = "外表年轻内心成熟，隐忍善谋，常有今昔对照的内心独白。"
narrative_devices = ["前世闪回与今生实景对照", "利用预知时的倒计时压迫", "强行干预故人命运后的意外反噬"]
arc_example = "主角前世被最信任的人背叛、含恨而终，一睁眼回到命运转折点之前。他/她抢先避开死劫，却发现救下一个本应死去的人后，整条命运线都偏离了记忆——先知不再可靠，唯有真正成长才能翻盘。"
universal = true
channels = ["male", "female"]
